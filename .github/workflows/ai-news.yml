name: AI news

on:
  schedule:
    # 03:00 UTC = 08:00 по времени UTC+5 (Казахстан). Для Москвы (UTC+3) поставьте "0 5 * * *".
    - cron: "0 3 * * *"
  workflow_dispatch:      # кнопка «Run workflow» для ручного запуска
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать новости
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
