<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИИ-новости дня</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1b1b1f;--muted:#6b6b76;--accent:#5b4bdb;--border:#e6e4df}
@media (prefers-color-scheme:dark){:root{--bg:#121216;--card:#1c1c22;--text:#ececf1;--muted:#9a9aa6;--accent:#9d91ff;--border:#2c2c35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:32px 16px 64px}
header h1{margin:0 0 4px;font-size:30px;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.tools input{flex:1 1 100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:15px}
.chip{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
article{display:flex;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.thumb{flex:0 0 180px;height:120px;border-radius:10px;overflow:hidden;display:block;text-decoration:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:8px;text-align:center;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 65% 45%),hsl(calc(var(--h) + 50) 65% 35%))}
.body{min-width:0;flex:1}
@media (max-width:560px){article{flex-direction:column}.thumb{flex:none;width:100%;height:180px}}
.meta{display:flex;gap:10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.src{color:var(--accent);font-weight:600}
article h2{margin:6px 0 4px;font-size:18px;line-height:1.35}
article h2 a{color:inherit;text-decoration:none}
article h2 a:hover{text-decoration:underline}
article p{margin:0;color:var(--muted);font-size:14.5px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🤖 ИИ-новости</h1>
  <p>Обновлено {{UPDATED}} · {{COUNT}} новостей за последние дни · обновляется каждый день в 08:00</p>
</header>
<div class="tools">
  <input id="q" type="search" placeholder="Поиск по новостям…">
  <button class="chip on" data-src="">Все</button>{{CHIPS}}
</div>
<main id="list">
{{CARDS}}
</main>
</div>
<script>
const q=document.getElementById('q'),chips=[...document.querySelectorAll('.chip')],cards=[...document.querySelectorAll('article')];
let src='';
function apply(){const t=q.value.toLowerCase();cards.forEach(c=>{c.style.display=(!src||c.dataset.src===src)&&c.textContent.toLowerCase().includes(t)?'':'none'})}
chips.forEach(b=>b.onclick=()=>{chips.forEach(x=>x.classList.remove('on'));b.classList.add('on');src=b.dataset.src;apply()});
q.oninput=apply;
</script>
</body>
</html>
